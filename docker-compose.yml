services:

  # ─── Redis (message broker) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vulnsploit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnsploit-backend
    restart: unless-stopped
    # Override the production CMD — use Django dev server locally for hot reload
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8001:8000"   # changed from 8000 to avoid conflict with other projects
    working_dir: /app
    volumes:
      - ./backend:/app    # live code reload in dev
      - media_data:/app/media    # persist generated PDFs across rebuilds
    env_file:
      - ./backend/.env    # loads SECRET_KEY, DEBUG, ALLOWED_HOSTS, etc.
    depends_on:
      redis:
        condition: service_healthy

  # ─── Celery worker ─────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnsploit-celery
    restart: unless-stopped
    command: celery -A Vulnsploit worker --loglevel=info --concurrency=2
    working_dir: /app
    volumes:
      - ./backend:/app
      - media_data:/app/media    # worker also writes PDFs
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "celery -A Vulnsploit inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ─── Celery Beat (scheduled scans) ─────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnsploit-beat
    restart: unless-stopped
    command: celery -A Vulnsploit beat --loglevel=info
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  media_data: